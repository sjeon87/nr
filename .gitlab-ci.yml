stages:
  - code-linting
  - build
  - documentation
  - deploy

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  NS3_RELEASE_VERSION: ns-3.48
  NS3_REPOSITORY_URL: https://gitlab.com/nsnam/ns-3-dev
  CMAKE_VERSION: 3.25.2

###################### BUILD STAGE #############################################

# Defines the steps to run the tests
# Inherit with "extends: .base-build" and remember to set
# the following variables: COMPILER (g++, clang++, ...) and
# MODE (debug, default, release)
.base-build:
  stage: build
  script:
    - git clone -b $NS3_RELEASE_VERSION --depth=1 $NS3_REPOSITORY_URL
    - mkdir -p $CCACHE_BASEDIR_VALUE
    - export CCACHE_BASEDIR=${PWD}
    - export CCACHE_DIR=${PWD}/$CCACHE_BASEDIR_VALUE
    - ln -s ${PWD} ns-3-dev/contrib/nr
    - pushd ns-3-dev
    - git log -1
    - CXX=$COMPILER CXXFLAGS="$FLAGS" ./ns3 configure -d $MODE -GNinja --enable-examples --enable-tests --enable-asserts --filter-module-examples-and-tests="nr" $EXTRAS
    - cmake --version
    - ccache -z
    - ./ns3 build
    - if [ "$MODE" != "debug" ] && [ "$REGRESSION_TEST" != "true" ] && [ "`./utils/ccache-miss-rate.py`" != "0" ]; then
        ./test.py --no-build --verbose-failed -f TAKES_FOREVER;
      fi
    - if [ "$REGRESSION_TEST" == "true" ] && [ "$MODE" == "release" ]; then
      ./contrib/nr/examples/3gpp-outdoor-calibration/test-outdoor-calibration.py;
      fi
    - ccache -s
    - ./ns3 clean
    - popd
    - rm -rf ns-3-dev
  cache:
    # Use separate key for each (debug/default/release) jobs because
    # they run in parallel and will otherwise overwrite each other
    # cache when they upload the cache archive at the end of the job,
    # resulting in only the cache for the last finished configuration
    # being stored.
    #
    # Do not distinguish between branches though to avoid
    # recompilation of all the files when a new branch is created.
    key: "ccache-$CI_JOB_NAME"
    paths:
      - $CCACHE_BASEDIR_VALUE/
  timeout: 9h
  interruptible: true
  variables:
    CCACHE_BASEDIR_VALUE: ns-3-ccache-storage

# Defines the per-commit jobs. They are executed for any branch
.base-per-commit-compile:
  extends: .base-build
  rules:
    # Skip per-commit builds on scheduled release pipelines; the dedicated
    # weekly/daily jobs cover those configurations.
    - if: '$RELEASE == "weekly" || $RELEASE == "daily"'
      when: never
    # Always build when a pipeline is started manually from the web UI.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # Otherwise only build when C++ or CMake sources change.
    - changes:
        - "**/*.cc"
        - "**/*.h"
        - "**/CMakeLists.txt"
        - "**/*.cmake"
  image: archlinux
  before_script:
    # Extra fluf to handle CTTC's MITM firewall and self-hosted gitlab instance
    # - openssl s_client -showcerts -servername gitlab.cttc.es -connect gitlab.cttc.es:443 </dev/null 2>/dev/null | sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > /etc/ssl/certs/gitlab.cttc.es.pem
    # - openssl s_client -showcerts -servername doi.org -connect doi.org:443 </dev/null 2>/dev/null | sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > /etc/ssl/certs/firewall.cttc.pem
    # - update-ca-trust
    # Proceed to normal behavior
    - pacman-key --init
    - pacman -Sy
    - pacman -S --noconfirm archlinux-keyring
    - pacman -Su --noconfirm base-devel gcc clang libc++ ninja ccache git python python-pip openssh eigen
    - python3 -m venv ns3env
    - source ./ns3env/bin/activate
    - pip install cmake==$CMAKE_VERSION

per-commit-clang-debug:
  extends: .base-per-commit-compile
  variables:
    MODE: debug
    COMPILER: clang++

per-commit-clang-release:
  extends: .base-per-commit-compile
  variables:
    MODE: release
    COMPILER: clang++

per-commit-clang-release-libc++:
  extends: .base-per-commit-compile
  variables:
    MODE: release
    COMPILER: clang++
    FLAGS: -stdlib=libc++

per-commit-gcc-debug:
  extends: .base-per-commit-compile
  variables:
    MODE: debug
    COMPILER: g++

per-commit-gcc-default:
  extends: .base-per-commit-compile
  variables:
    MODE: default
    COMPILER: g++
  tags:
    - CTTC

per-commit-gcc-release-no-lte:
  extends: .base-per-commit-compile
  variables:
    MODE: release
    COMPILER: g++
    EXTRAS: --disable-module=lte

per-commit-gcc-release-sanitizers:
  extends: .base-per-commit-compile
  # Sanitizers only need to re-run on C++ source changes, not CMake changes.
  rules:
    - if: '$RELEASE == "weekly" || $RELEASE == "daily"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - changes:
        - "**/*.cc"
        - "**/*.h"
  variables:
    MODE: release
    COMPILER: g++
    EXTRAS: --enable-sanitizers
  tags:
    - CTTC

# MemorySanitizer catches reads of uninitialized memory, a defect class that is
# invisible to the address/leak/undefined sanitizers job and that valgrind only
# partially reports (it stays silent when uninitialized bytes are merely copied
# or serialized rather than branched on). MSan requires every linked C++
# library to be instrumented, so the job first builds an MSan-instrumented
# libc++/libc++abi matching the clang version (cached across runs) and compiles
# ns-3 and nr against it. The fast unwinder avoids the sanitizer re-entering
# the unwinder on report, and dtor poisoning is disabled to mute a known
# use-after-dtor report in the ns-3 wifi static teardown. Note for runner
# configuration: MSan may re-exec with ASLR disabled via
# personality(ADDR_NO_RANDOMIZE), which the default Docker seccomp profile
# blocks; the runner must be privileged or use a seccomp profile allowing it
# (verified locally with gitlab-ci-local --privileged).
weekly-clang-msan:
  stage: build
  image: archlinux
  rules:
    - if: $RELEASE == "weekly"
    - if: '$CI_PIPELINE_SOURCE == "web"'
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  before_script:
    - pacman-key --init
    - pacman -Sy
    - pacman -S --noconfirm archlinux-keyring
    - pacman -Su --noconfirm base-devel clang llvm ninja ccache git python curl
    - python3 -m venv ns3env
    - source ./ns3env/bin/activate
    - pip install cmake==$CMAKE_VERSION
  script:
    # Canary for the runner capability described above: setarch -R uses the
    # same personality(ADDR_NO_RANDOMIZE) syscall MSan falls back to when its
    # shadow mapping collides with ASLR. A failure here does not necessarily
    # doom the job (hosts with vm.mmap_rnd_bits <= 28 rarely need the re-exec),
    # so warn loudly instead of aborting.
    - setarch $(uname -m) -R true
      || echo "WARNING - this runner blocks personality(ADDR_NO_RANDOMIZE); if MemorySanitizer later aborts with 'unable to disable ASLR', run this job on a privileged runner, allow the syscall in the seccomp profile, or set vm.mmap_rnd_bits=28 on the runner host"
    # Build an MSan-instrumented libc++ matching the installed clang
    - LLVM_VERSION=$(clang --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
    - if [ ! -e msan-libcxx/lib/libunwind.so ]; then
        curl -sLO https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/llvm-project-$LLVM_VERSION.src.tar.xz &&
        tar xf llvm-project-$LLVM_VERSION.src.tar.xz &&
        cmake -G Ninja -S llvm-project-$LLVM_VERSION.src/runtimes -B llvm-msan-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind"
          -DLLVM_USE_SANITIZER=MemoryWithOrigins
          -DCMAKE_INSTALL_PREFIX=${PWD}/msan-libcxx &&
        ninja -C llvm-msan-build install-cxx install-cxxabi install-unwind &&
        rm -rf llvm-project-$LLVM_VERSION.src llvm-project-$LLVM_VERSION.src.tar.xz llvm-msan-build;
      fi
    - MSAN_LIBCXX=${PWD}/msan-libcxx
    - git clone -b $NS3_RELEASE_VERSION --depth=1 $NS3_REPOSITORY_URL
    - mkdir -p $CCACHE_BASEDIR_VALUE
    - export CCACHE_BASEDIR=${PWD}
    - export CCACHE_DIR=${PWD}/$CCACHE_BASEDIR_VALUE
    - ln -s ${PWD} ns-3-dev/contrib/nr
    - pushd ns-3-dev
    # The sanitizer flags are passed straight to CMake because the ns3 wrapper
    # filters -fsanitize from the CXXFLAGS/LDFLAGS environment variables, and
    # the clang stdlib workaround probes are pre-seeded because they link
    # without the MSan runtime and would spuriously fail
    - CXX=clang++ ./ns3 configure -d default -GNinja --enable-examples --enable-tests --enable-asserts --filter-module-examples-and-tests="nr" --
      -DCLANG_STDLIBCPP_WORKS=FALSE -DCLANG_LIBCPP_WORKS=TRUE
      -DCMAKE_CXX_FLAGS="-stdlib=libc++ -nostdinc++ -isystem $MSAN_LIBCXX/include/c++/v1 -fsanitize=memory -fsanitize-memory-track-origins"
      -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -fsanitize=memory -L$MSAN_LIBCXX/lib -Wl,-rpath,$MSAN_LIBCXX/lib"
      -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++ -fsanitize=memory -L$MSAN_LIBCXX/lib -Wl,-rpath,$MSAN_LIBCXX/lib"
    - ./ns3 build
    - export MSAN_OPTIONS=strict_memcmp=0:fast_unwind_on_fatal=1:fast_unwind_on_malloc=1:poison_in_dtor=0
    - for suite in nr-cell-selection nr-cell-selection-with-rlf nr-handover-delay
        nr-handover-failure nr-handover-rach-config nr-handover-scenarios
        nr-handover-target nr-inter-freq-handover nr-rlf-fdd nr-rlf-tdd
        nr-rlf-tdd-flexible nr-rlf-tdd-mixed nr-rrc nr-ue-measurements
        nr-x2-handover nr-x2-handover-measures nr-epc-e2e-data; do
        ./build/utils/ns3-dev-test-runner-default --suite=$suite --stop-on-failure || exit 1;
      done
    - popd
    - rm -rf ns-3-dev
  cache:
    key: "msan-$CI_JOB_NAME"
    paths:
      - $CCACHE_BASEDIR_VALUE/
      - msan-libcxx/
  variables:
    CCACHE_BASEDIR_VALUE: ns-3-ccache-storage
  timeout: 9h
  interruptible: true
  tags:
    - CTTC

# Valgrind memcheck complements the MemorySanitizer job: it needs no special
# toolchain and additionally checks the ns-3 libraries the nr module links
# against, at the price of a much larger slowdown. Only the QUICK fullness is
# exercised, and the build is configured with tests but WITHOUT examples so only
# the test suites are grinded (grinding examples too is effectively unbounded).
# Even so, QUICK-under-valgrind is heavy: summed over the nr suites it is
# ~13 CPU-hours, dominated by a few numerical suites (nr-test-csi ~2.6 h,
# nr-ideal-beamforming-test ~2.4 h). The suites are run in parallel (xargs -P
# nproc), so wall-clock is bounded by the slowest single suite (~2.7 h) and
# stays under the 9 h timeout down to about two cores.
#
# valgrind is invoked directly rather than through test.py -g: the latter
# hardcodes --errors-for-leak-kinds=all, which counts still-reachable blocks
# (framework/singleton allocations that are alive at exit -- not leaks) as
# errors, so it reports failures for suites that have no actual memory error
# (verified: nr-channel-setup-test etc. show "definitely lost: 0" with only
# still reachable). Here we keep valgrind's default error leak-kinds
# (definite,possible), so real leaks and real memory errors fail the job while
# benign still-reachable does not.
#
# This job uses an Ubuntu image rather than the archlinux one shared by the
# other jobs on purpose: Arch ships a stripped ld.so and provides its debug
# symbols only over networked debuginfod, which makes valgrind refuse to start
# ("stripped ld.so ... Cannot continue"). On Ubuntu the valgrind package pulls
# the glibc debug symbols in and it runs offline out of the box.
weekly-gcc-valgrind:
  stage: build
  image: ubuntu:24.04
  rules:
    - if: $RELEASE == "weekly"
    - if: '$CI_PIPELINE_SOURCE == "web"'
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --yes
      ca-certificates
      g++ ninja-build build-essential
      git ccache valgrind
      libeigen3-dev
      python3 python3-dev python3-pip python3-venv
    - python3 -m venv ns3env
    - source ./ns3env/bin/activate
    - pip install cmake==$CMAKE_VERSION
  script:
    - git clone -b $NS3_RELEASE_VERSION --depth=1 $NS3_REPOSITORY_URL
    - mkdir -p $CCACHE_BASEDIR_VALUE
    - export CCACHE_BASEDIR=${PWD}
    - export CCACHE_DIR=${PWD}/$CCACHE_BASEDIR_VALUE
    - ln -s ${PWD} ns-3-dev/contrib/nr
    - pushd ns-3-dev
    - CXX=g++ ./ns3 configure -d default -GNinja --enable-tests --disable-examples --enable-asserts --filter-module-examples-and-tests="nr"
    - ./ns3 build
    # Run every nr test suite under valgrind memcheck in parallel, at QUICK
    # fullness, applying the in-tree suppressions (.ns3.supp). A suite with a
    # real memory error or leak makes valgrind exit non-zero (--error-exitcode),
    # and a failing test case makes the runner exit non-zero; either records a
    # failure. The whole matrix is reduced to a single pass/fail at the end.
    - |
      RUNNER=./build/utils/ns3-dev-test-runner-default
      rm -f vg-failed
      "$RUNNER" --list | grep -E '^nr' | xargs -P "$(nproc)" -I{} sh -c '
        s="$1"
        if ! valgrind --suppressions=.ns3.supp --leak-check=full --error-exitcode=1 \
             ./build/utils/ns3-dev-test-runner-default --test-name="$s" \
             --stop-on-failure --fullness=QUICK > "vg-$s.log" 2>&1; then
          echo "===== FAILURE UNDER VALGRIND: $s ====="
          cat "vg-$s.log"
          touch vg-failed
        fi' _ {}
      if [ -e vg-failed ]; then
        echo "One or more suites reported a valgrind error or test failure"
        exit 1
      fi
    - popd
    - rm -rf ns-3-dev
  cache:
    key: "ccache-$CI_JOB_NAME"
    paths:
      - $CCACHE_BASEDIR_VALUE/
  variables:
    CCACHE_BASEDIR_VALUE: ns-3-ccache-storage
  timeout: 9h
  interruptible: true
  tags:
    - CTTC

weekly-sionna:
  stage: build
  image: ubuntu:24.04
  rules:
    - if: $RELEASE == "weekly"
    - if: '$CI_PIPELINE_SOURCE == "web"'
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  before_script:
    - apt update
    - apt upgrade --yes
    - DEBIAN_FRONTEND=noninteractive apt install --no-install-recommends --yes
      ca-certificates
      g++ ninja-build build-essential
      git
      libboost-all-dev
      libeigen3-dev
      libgsl-dev gsl-bin
      python3 python3-dev python3-pip python3-venv
    - python3 -m venv ns3env
    - source ./ns3env/bin/activate
    - pip install cmake==$CMAKE_VERSION sionna==1.2.0 sionna-rt==1.2.0 pybind11==2.11.1 cppyy==3.5.0
  script:
    - git clone -b $NS3_RELEASE_VERSION --depth=1 $NS3_REPOSITORY_URL
    - ln -s ${PWD} ns-3-dev/contrib/nr
    - pushd ns-3-dev
    - ./ns3 configure -G Ninja --enable-python-bindings --enable-examples --filter-module-examples-and-tests=nr
    - ./ns3 run cttc-nr-demo-sionna-rt
    - popd
  timeout: 3h
  interruptible: true

documentation:
  stage: documentation
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y tzdata
    - apt-get install -y ccache g++ doxygen graphviz make imagemagick dia
      texlive texlive-font-utils latexmk texlive texlive-science texlive-formats-extra texlive-base
      fonts-freefont-otf fonts-freefont-ttf git libeigen3-dev libsqlite3-dev dvipng
      python3 python3-dev python3-pip python3-venv python3-sphinx python3-sphinx-rtd-theme python3-jinja2 python3-pygments
    - python3 -m venv ns3env
    - source ./ns3env/bin/activate
    # seqdiag renders the .seqdiag figures. Its stock blockdiag backend (3.0.0)
    # is unmaintained and breaks on Pillow >= 10 (getsize()/ANTIALIAS were
    # removed), so install the maintained yuzutech/blockdiag fork instead: it
    # works with the current Pillow wheel, so no Pillow pin or from-source build
    # is needed. setuptools < 81 is kept only so the stock seqdiag 3.0.0 sdist
    # still installs; reportlab is the seqdiag PDF backend; cmake comes from pip.
    - pip install seqdiag==3.0.0 "git+https://github.com/yuzutech/blockdiag.git" reportlab "setuptools<81" cmake==$CMAKE_VERSION
    # blockdiag only autodetects Japanese fonts, so the reportlab PDF backend
    # needs a font pointed at explicitly (fonts-freefont-ttf installed above).
    - printf '[seqdiag]\nfontpath = /usr/share/fonts/truetype/freefont/FreeSans.ttf\n' > "$HOME/.blockdiagrc"
    # Relax ImageMagick's policy so the EPS/PDF coders work, independent of the
    # installed major version (the policy path is ImageMagick-6 or -7).
    - for policy in /etc/ImageMagick-*/policy.xml ; do
      [ -f "$policy" ] || continue ;
      sed -i "s/EPS,PDF,//g" "$policy" ;
      sed -i "s/none/read\ |\ write/g" "$policy" ;
      done
  image: ubuntu:24.04
  script:
    # Setup ccache
    - mkdir -p $CCACHE_BASEDIR_VALUE
    - export CCACHE_BASEDIR=${PWD}
    - export CCACHE_DIR=${PWD}/$CCACHE_BASEDIR_VALUE
    - rm -Rf ns-3-dev
    # Clone ns-3 and configure then extract introspected doxygen
    - git clone -b $NS3_RELEASE_VERSION --depth=1 $NS3_REPOSITORY_URL
    - ln -s ${PWD} ns-3-dev/contrib/nr
    - pushd ns-3-dev
    - ./ns3 configure --enable-examples --enable-tests --filter-module-examples-and-tests=nr
    - ./ns3 build nr-print-introspected-doxygen
    - ./ns3 run nr-print-introspected-doxygen --no-build --quiet > contrib/nr/doc/introspected-doxygen.h
    - popd
    # Export nr version for documentation
    - export NRVERSION="nr-`git describe --tags`"
    - mkdir -p public/manual
    # Treat Sphinx warnings (missing figures, broken refs) as errors and
    # stop the build at the first one
    - SPHINXSTRICT="-W"
    # Build NR manual
    - pushd doc
    - make latexpdf SPHINXOPTS="$SPHINXSTRICT" && mv ./build/latex/nrmodule.pdf ../public/
    - make html SPHINXOPTS="$SPHINXSTRICT" && mv ./build/html/* ../public/manual
    # Build doxygen
    - doxygen doxygen.conf && mv ./doc/html/ ../public/
    - popd
    # Build tutorial
    - pushd tutorial
    - make latexpdf SPHINXOPTS="$SPHINXSTRICT" && mv ./build/latex/cttc-nr-demo-tutorial.pdf ../public/
    - popd
    # Verify that the expected documentation outputs were actually generated
    - test -s public/nrmodule.pdf
    - test -s public/manual/nr-module.html
    - test -s public/html/index.html
    - test -s public/cttc-nr-demo-tutorial.pdf
    # Copy FEATURES.md to preview it 5G-LENA website in FEATURES section
    - pushd ns-3-dev/contrib/nr
    - cp FEATURES.md public/FEATURES.md
    - popd
  artifacts:
    paths:
      - public
  cache:
    key: "ccache-$CI_JOB_NAME"
    paths:
      - $CCACHE_BASEDIR_VALUE/
  timeout: 9h
  interruptible: true
  variables:
    CCACHE_BASEDIR_VALUE: ns-3-ccache-storage

pages:
  stage: deploy
  dependencies:
    - documentation
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "Deploying the documentation"
  artifacts:
    paths:
      - public

include:
  - '.gitlab-ci-clang.yml'
  - '.gitlab-ci-gcc.yml'
  - '.gitlab-ci-code-linting.yml'
  - '.gitlab-ci-mac.yml'
